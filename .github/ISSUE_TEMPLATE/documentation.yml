name: Documentation issue
description: Report unclear, missing, or inaccurate public documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal paths, transcripts, session identifiers, or Remote Control URLs.
  - type: input
    id: page
    attributes:
      label: Page or section
      description: Link the affected file or name the heading.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
      description: Describe the gap and the reader goal it blocks.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
      description: Optional replacement wording or missing example.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Not platform-specific
        - Windows
        - Linux or WSL
        - macOS
    validations:
      required: true
