name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: [self-hosted, "${{ matrix.runner_os }}", "${{ github.event_name == 'pull_request' && 'rail-ci-pr' || 'rail-ci-maintenance' }}"]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24
          - 26
        # Labels select scheduling pools; both require fresh one-job guests.
        # They do not establish isolation or restrict fork-controlled YAML.
        # Keep os values stable because they form the required check names.
        include:
          - os: ubuntu-latest
            runner_os: Linux
          - os: windows-latest
            runner_os: Windows
          - os: macos-latest
            runner_os: macOS

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Configure macOS tool paths
        if: runner.os == 'macOS'
        run: |
          for tool_dir in /opt/homebrew/bin /usr/local/bin "$RUNNER_TOOL_CACHE/tmux/3.7c/x64/bin"; do
            if [ -d "$tool_dir" ]; then
              printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
            fi
          done

      - name: Verify Unix runner prerequisites
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for tool in git tmux python3 make; do
            command -v "$tool"
          done
          tmux -V

      - name: Verify macOS compiler prerequisites
        if: runner.os == 'macOS'
        run: |
          command -v clang
          xcode-select -p
          xcrun --find clang

      - name: Install locked dependencies
        run: npm ci

      - name: Run portable test suite
        run: npm test

      - name: Validate Windows installer failure handling
        if: runner.os == 'Windows'
        run: npm run test:installer:windows

      - name: Validate Windows command wrappers
        if: runner.os == 'Windows'
        run: npm run test:wrapper:windows

      - name: Validate Linux/macOS installer registration
        if: runner.os != 'Windows'
        run: npm run test:installer:unix

      - name: Validate tmux ownership and multiline paste
        if: runner.os != 'Windows'
        run: npm run test:tmux

      - name: Validate package contents
        run: npm pack --dry-run
