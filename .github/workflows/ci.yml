name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24
          - 26

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install tmux on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Install locked dependencies
        run: npm ci

      - name: Run portable test suite
        run: npm test

      - name: Validate Windows installer failure handling
        if: runner.os == 'Windows'
        run: npm run test:installer:windows

      - name: Validate Windows command wrappers
        if: runner.os == 'Windows'
        run: npm run test:wrapper:windows

      - name: Validate Linux/macOS installer registration
        if: runner.os != 'Windows'
        run: npm run test:installer:unix

      - name: Validate tmux ownership and multiline paste
        if: runner.os != 'Windows'
        run: npm run test:tmux

      - name: Validate package contents
        run: npm pack --dry-run
